<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page</title>

     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

     
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Mono:wght@700&display=swap"
        rel="stylesheet">

    <style>
         
         
         
        :root {
            --space-black: #050608;
            --neon-cyan: #66FCF1;
            --cyan-glow: rgba(102, 252, 241, 0.4);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--space-black);
            color: var(--text-main);
            overflow: hidden;
             
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .font-mono {
            font-family: 'Space Mono', monospace !important;
        }

         
        .bg-image {
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            opacity: 0.3;
            z-index: 0;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--space-black) 80%);
            z-index: 1;
        }

         
        .glow-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(102, 252, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 2;
            animation: pulseOrb 4s infinite alternate ease-in-out;
        }

        @keyframes pulseOrb {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

         
        .error-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-cyan);
            text-shadow: 0 0 20px var(--cyan-glow);
            margin-bottom: 10px;
            animation: glitchEffect 3s infinite;
        }

         
        @keyframes glitchEffect {

            0%,
            100% {
                transform: translate(0);
                text-shadow: 0 0 20px var(--cyan-glow);
            }

            20% {
                transform: translate(-2px, 2px);
                text-shadow: 2px 0 #FF4C4C, -2px 0 var(--neon-cyan);
            }

            21% {
                transform: translate(0);
                text-shadow: 0 0 20px var(--cyan-glow);
            }

            40% {
                transform: translate(2px, -2px);
                text-shadow: 2px 0 var(--neon-cyan), -2px 0 #FF4C4C;
            }

            41% {
                transform: translate(0);
                text-shadow: 0 0 20px var(--cyan-glow);
            }
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .error-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
        }

         
        .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .cyber-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .primary-btn {
            background: var(--neon-cyan);
            color: var(--space-black);
            border: 2px solid var(--neon-cyan);
        }

        .primary-btn:hover {
            background: var(--text-main);
            border-color: var(--text-main);
            box-shadow: 0 0 20px var(--cyan-glow);
            transform: translateY(-3px);
        }

        .outline-btn {
            background: rgba(102, 252, 241, 0.05);
            color: var(--neon-cyan);
            border: 2px solid rgba(102, 252, 241, 0.4);
            backdrop-filter: blur(10px);
        }

        .outline-btn:hover {
            background: var(--neon-cyan);
            color: var(--space-black);
            box-shadow: 0 0 15px var(--cyan-glow);
            transform: translateY(-3px);
        }

         
        @media (max-width: 576px) {
            .btn-group {
                flex-direction: column;
                gap: 15px;
            }

            .cyber-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

     
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="glow-orb"></div>

     
    <div class="error-container">
        <h1 class="error-code font-mono">404</h1>
        <h2 class="error-title">Signal Lost in Deep Space</h2>
        <p class="error-desc">The coordinates you are looking for do not exist in our galaxy map. Please check your
            telemetry data or return to the command center.</p>

        <div class="btn-group">
             
            <button onclick="goBackPage()" class="cyber-btn outline-btn">
                <i class="fa-solid fa-arrow-rotate-left"></i> Go Back
            </button>

             
            <button onclick="goHomePage()" class="cyber-btn primary-btn">
                Return to Base <i class="fa-solid fa-house"></i>
            </button>
        </div>
    </div>

     
    <script>
 
        function goBackPage() {
 
            if (window.history.length > 1) {
                window.history.back();
            } else {
 
                window.location.href = "index.html";
            }
        }

 
        function goHomePage() {
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
