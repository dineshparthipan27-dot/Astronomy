<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>

     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

     
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

     
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-split-container">

         
        <div class="auth-banner">
             
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

            <div class="banner-overlay"></div>
            <div class="banner-glow glow-top"></div>
            <div class="banner-glow glow-bottom"></div>

            <div class="banner-content">
                <div class="pulse-badge">
                    <span class="dot"></span>
                    <span>SECURE ENCRYPTED LOGIN</span>
                </div>

                <div class="banner-text">
                    <h1>Cosmic<br><span class="text-cyan-glow">Explorers Hub.</span></h1>
                    <p>Access your dashboard to manage observatory arrays, book new expeditions, and monitor real-time
                        telemetry data.</p>
                </div>

                <div class="glass-stats-wrapper">
                    <div class="glass-stat-card">
                        <i class="fa-solid fa-users"></i>
                        <div>
                            <h4 class="font-mono">50,000+</h4>
                            <span>Active Users</span>
                        </div>
                    </div>
                    <div class="glass-stat-card">
                        <i class="fa-solid fa-bolt"></i>
                        <div>
                            <h4 class="font-mono">&lt; 2ms</h4>
                            <span>Fast Execution</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

         
        <div class="auth-form-area">
            <div class="form-container">

                <div class="form-header">
                    <div class="logo">
                        <img src="./asset/aqua_logo.webp" alt="Company Logo" class="logo-img">
                    </div>
                    <p>Enter your credentials to continue.</p>
                </div>

                 
                <div class="pill-tabs">
                    <div class="pill-slider" id="pillSlider"></div>
                    <button class="pill-btn active" id="btnShowLogin">Login</button>
                    <button class="pill-btn" id="btnShowSignup">Sign Up</button>
                </div>

                 
                <form id="loginForm" class="auth-form active-form" novalidate>

                    <div class="input-group">
                        <i class="fa-solid fa-layer-group group-icon"></i>
                        <select id="loginRole" required>
                            <option value="" disabled selected></option>
                            <option value="admin">Admin</option>
                            <option value="user">User</option>
                        </select>
                        <label>Select Role</label>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope group-icon"></i>
                        <input type="email" id="loginEmail" placeholder=" " required>
                        <label>Email</label>
                        <span class="error-msg" id="loginEmailError"></span>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-key group-icon"></i>
                        <input type="password" id="loginPassword" placeholder=" " required>
                        <label>Password</label>
                        <i class="fa-solid fa-eye toggle-pwd"></i>
                        <span class="error-msg" id="loginPasswordError"></span>
                    </div>

                    <div class="form-actions">
                        <label class="remember-checkbox">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Login</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>

                 
                <form id="signupForm" class="auth-form" novalidate>

                    <div class="input-group">
                        <i class="fa-solid fa-layer-group group-icon"></i>
                        <select id="signupRole" required>
                            <option value="" disabled selected></option>
                            <option value="admin">Admin</option>
                            <option value="user">User</option>
                        </select>
                        <label>Select Role</label>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-user group-icon"></i>
                        <input type="text" id="signupName" placeholder=" " required>
                        <label>Name</label>
                        <span class="error-msg" id="signupNameError"></span>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope group-icon"></i>
                        <input type="email" id="signupEmail" placeholder=" " required>
                        <label>Email</label>
                        <span class="error-msg" id="signupEmailError"></span>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock group-icon"></i>
                        <input type="password" id="signupPassword" placeholder=" " required>
                        <label>Password</label>
                        <i class="fa-solid fa-eye toggle-pwd"></i>
                        <span class="error-msg" id="signupPasswordError"></span>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-shield-halved group-icon"></i>
                        <input type="password" id="signupConfirm" placeholder=" " required>
                        <label>Confirm Password</label>
                        <span class="error-msg" id="signupConfirmError"></span>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Sign Up</span> <i class="fa-solid fa-user-plus"></i>
                    </button>
                </form>

            </div>
        </div>

    </div>

     
    <script src="login.js"></script>
</body>

</html>
